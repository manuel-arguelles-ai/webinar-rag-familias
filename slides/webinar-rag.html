<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAG para Soluciones Productivas</title>
<link rel="icon" href="data:,">
<style>:root{
  --navy:#001C59;--violet:#E82052;--blue:#0051FA;--sky:#0051FA;--ink:#1A1A1A;
  --tintblue:#E6EEFE;--tintviolet:#FDE8EE;--bg:#F0F3F7;--card:#fff;
  --line:rgba(0,28,89,.32);--line-soft:rgba(0,28,89,.14);--shadow:rgba(0,28,89,.09);
  --ok:#15803d;--okbg:#e6f6ec;--bad:#dc2626;--badbg:#fdeaea;--warn:#b45309;--warnbg:#fff4de;--muted:#274876;
  --c-denso:#0051FA;--c-bm25:#d97706;--c-rrf:#64748b;--c-hib:#E82052;
  --grad:linear-gradient(90deg,#0051FA,#E82052);
  --serif:"Source Serif 4","Source Serif Pro",Charter,Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-tema="oscuro"]{
  --navy:#dbe5ff;--ink:#eceffd;--bg:#001240;--card:#001C59;--tintblue:#0a2f80;--tintviolet:#4a1030;
  --line:rgba(150,168,255,.42);--line-soft:rgba(150,168,255,.2);--shadow:rgba(0,0,0,.4);--muted:#a3aedb;
  --okbg:#10321f;--badbg:#3a1518;--warnbg:#3a2a0d;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;
  --c-denso:#6ea1ff;--c-bm25:#fbbf24;--c-rrf:#94a3b8;--c-hib:#FF4081;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1230;font-family:var(--sans);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
select,input{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1230}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;border-radius:6px}
.slide{position:absolute;inset:0;padding:70px 100px 96px;opacity:0;pointer-events:none;transition:opacity .45s ease,transform .45s ease;transform:translateX(40px)}
.slide.activa{opacity:1;pointer-events:auto;transform:none}
.slide.salio{transform:translateX(-40px)}
.cab{display:flex;align-items:center;gap:18px;margin-bottom:14px}
.bloque{font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);background:var(--tintviolet);padding:6px 16px;border-radius:99px}
.mins{font-size:22px;color:var(--muted);font-weight:500}
h1.t{font-family:var(--serif);font-weight:900;font-size:62px;line-height:1.08;color:var(--navy);max-width:1560px;letter-spacing:-.01em}
h1.t em{font-style:normal;color:var(--violet)}
.linea{height:5px;width:150px;border-radius:9px;background:var(--grad);margin:22px 0 30px}
.sub{font-size:30px;line-height:1.4;color:var(--ink);max-width:1500px}
.sub b{color:var(--navy)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.pie-marca{position:absolute;left:100px;right:100px;bottom:28px;display:flex;justify-content:space-between;font-size:19px;color:var(--muted)}
/* cartas y chips */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 8px 26px var(--shadow);padding:22px 26px}
.card h3{font-family:var(--serif);font-size:30px;color:var(--navy);margin-bottom:8px}
.pill{display:inline-block;font-size:20px;font-weight:600;padding:4px 14px;border-radius:99px;border:1.5px solid var(--blue);color:var(--blue);background:transparent}
.pill.llena{background:var(--violet);border-color:var(--violet);color:#fff}
.pill.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.pill.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.pill.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.btn{background:var(--card);border:1.5px solid var(--navy);color:var(--navy);padding:10px 22px;border-radius:12px;font-size:24px;font-weight:600;transition:all .15s}
.btn:hover{background:var(--tintblue)}
.btn.pri{background:var(--navy);color:#fff}
:root[data-tema="oscuro"] .btn.pri{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.sel{background:var(--navy);color:#fff}
:root[data-tema="oscuro"] .btn.sel{background:var(--violet);border-color:var(--violet)}
.btn.peq{font-size:21px;padding:6px 14px}
.fila{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:22px}
select.sel{background:var(--card);border:1.5px solid var(--navy);border-radius:12px;padding:10px 14px;font-size:23px;max-width:1100px}
input[type=range]{accent-color:var(--violet);width:300px;height:30px}
label.l{font-size:23px;color:var(--muted);font-weight:600}
.num{font-family:var(--serif);font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* revelado por pasos */
.paso{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}
.paso.on{opacity:1;transform:none}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(232,32,82,.5)}50%{box-shadow:0 0 0 14px rgba(232,32,82,0)}}
@keyframes flujo{to{stroke-dashoffset:-40}}
@keyframes sello{0%{transform:scale(2.4) rotate(-14deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.entra{animation:subir .45s ease both;animation-delay:calc(var(--i,0)*70ms)}
/* barras */
.barra{height:22px;border-radius:8px;background:var(--line-soft);overflow:hidden;position:relative}
.barra>i{display:block;height:100%;border-radius:8px;background:var(--blue);transition:width .6s cubic-bezier(.2,.8,.2,1)}
/* tablas */
table.tb{border-collapse:collapse;font-size:24px;width:100%}
table.tb th{font-size:20px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:2px solid var(--line)}
table.tb td{padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.warnc{color:var(--warn);font-weight:700}
/* HUD */
#hud{position:fixed;left:0;right:0;bottom:0;height:42px;display:flex;align-items:center;gap:14px;padding:0 16px;background:rgba(8,14,40,.92);color:#dbe5ff;font-size:15px;z-index:20;backdrop-filter:blur(8px)}
#hud .prog{flex:1;height:6px;background:rgba(255,255,255,.14);border-radius:9px;overflow:hidden}
#hud .prog i{display:block;height:100%;background:var(--grad);width:0;transition:width .35s}
#hud button{background:transparent;border:1px solid rgba(205,214,255,.35);color:#dbe5ff;border-radius:8px;padding:4px 11px;font-size:14px}
#hud button:hover{background:rgba(255,255,255,.1)}
#reloj{font-variant-numeric:tabular-nums;min-width:210px;text-align:right}
#reloj .adel{color:#4ade80}#reloj .atras{color:#f87171}
#notas{position:fixed;left:0;right:0;bottom:42px;background:rgba(8,14,40,.97);color:#e9ecfb;padding:18px 34px;font-size:19px;line-height:1.5;z-index:19;max-height:34vh;overflow:auto;display:none;border-top:3px solid var(--violet)}
#notas.ver{display:block}
#notas b{color:#FF4081}
#vista{position:fixed;inset:0;background:rgba(8,14,40,.96);z-index:30;display:none;overflow:auto;padding:36px}
#vista.ver{display:block}
#vista .cuadricula{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
#vista .mini{background:#fff;color:#001C59;border-radius:12px;padding:14px 16px;cursor:pointer;border:3px solid transparent;text-align:left}
#vista .mini.act{border-color:#E82052}
#vista .mini small{display:block;color:#7a49c9;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
#vista .mini b{font-family:var(--serif);font-size:17px;line-height:1.2;display:block;margin:4px 0}
#vista .mini span{color:#667;font-size:13px}
#ayuda{position:fixed;right:18px;bottom:56px;background:rgba(8,14,40,.97);color:#e9ecfb;padding:16px 22px;border-radius:14px;font-size:16px;line-height:1.9;z-index:31;display:none;border:1px solid rgba(255,255,255,.2)}
#ayuda.ver{display:block}
kbd{background:rgba(255,255,255,.16);border-radius:5px;padding:1px 7px;font-family:var(--mono);font-size:14px}
/* ---- laboratorio de consultas ---- */
.lab-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:18px}
.lab-col h4{font-family:var(--serif);font-size:30px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.lab-col .dot{width:16px;height:16px;border-radius:50%}
.res{display:grid;grid-template-columns:44px 1fr 120px;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line-soft);background:var(--card);margin-bottom:9px;font-size:22px}
.res .pos{font-weight:800;color:var(--muted);font-size:24px}
.res .nm b{display:block;font-size:22px}.res .nm small{color:var(--muted);font-size:17px}
.res.correcto{border-color:var(--ok);background:var(--okbg)}
.res.correcto .pos{color:var(--ok)}
.res .mini-barra{height:10px;border-radius:6px;background:var(--line-soft);overflow:hidden}.res .mini-barra i{display:block;height:100%}
.vacio{padding:22px;border:2px dashed var(--bad);border-radius:12px;color:var(--bad);font-size:22px;background:var(--badbg)}
.veredicto{margin-top:6px;font-size:22px}
/* mapa */
.fam{perspective:900px;height:300px;cursor:pointer}
.fam .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fam.vuelta .in{transform:rotateY(180deg)}
.fam .cara{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:20px 22px;border:1.5px solid var(--line);background:var(--card);box-shadow:0 8px 24px var(--shadow);overflow:hidden}
.fam .atras{transform:rotateY(180deg);background:var(--tintviolet);font-size:19px;line-height:1.35}
.fam .n{font-family:var(--serif);font-weight:900;font-size:44px;line-height:1}
.fam h3{font-family:var(--serif);font-size:27px;color:var(--navy);margin:6px 0 8px;line-height:1.15}
.fam p{font-size:20px;color:var(--ink);line-height:1.3}
.fam .atras b{color:var(--navy)}
.tag-med{position:absolute;right:16px;top:16px}
/* árbol / contrato */
.contrato{position:relative;font-size:19px;line-height:1.5;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px 24px;height:680px;overflow:auto}
.contrato .cl{padding:6px 8px;border-radius:8px;margin-bottom:4px;border-left:5px solid transparent}
.contrato .cl.obj{border-left-color:var(--ok);background:var(--okbg)}
.contrato .cl .num-cl{font-weight:800;color:var(--navy);margin-right:6px}
.contrato .w{padding:1px 0;transition:background .35s}
.contrato .w.cov{background:rgba(232,32,82,.28);box-shadow:0 0 0 2px rgba(232,32,82,.0)}
.contrato .w.cov.fuera{background:rgba(217,119,6,.32)}
/* grafo */
svg text{font-family:var(--sans)}
.nodo circle{fill:var(--tintblue);stroke:var(--navy);stroke-width:2;transition:all .35s}
.nodo text{font-size:17px;fill:var(--ink);text-anchor:middle;font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:5px}
.nodo.on circle{fill:var(--violet);stroke:var(--violet)}
.nodo.sem circle{stroke:var(--ok);stroke-width:5}
.arista line{stroke:var(--line);stroke-width:2.5;transition:all .35s}
.arista.on line{stroke:var(--violet);stroke-width:7;stroke-dasharray:14 8;animation:flujo .8s linear infinite}
.arista text{font-size:14px;fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.arista.on text{fill:var(--violet);font-weight:800}
.chip{display:inline-block;padding:3px 12px;border-radius:9px;font-family:var(--mono);font-size:19px;margin:3px 4px 3px 0;border:1.5px solid var(--line)}
.chip.nec{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.ruido{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.chip.falta{background:var(--badbg);border-color:var(--bad);color:var(--bad);border-style:dashed}
/* router */
.carril{display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:14px;border:1.5px solid var(--line-soft);background:var(--card);margin-bottom:10px;transition:all .4s;font-size:24px;opacity:.55}
.carril.gana{opacity:1;border-color:var(--violet);background:var(--tintviolet);box-shadow:0 0 0 4px rgba(232,32,82,.2);animation:pulso 1.3s 2}
.carril .ic{font-size:34px;width:52px;text-align:center}
.carril .pb{flex:1;max-width:340px}
/* sello puerta */
.sello{display:inline-block;border:6px solid;border-radius:14px;padding:6px 26px;font-family:var(--serif);font-weight:900;font-size:56px;letter-spacing:.06em;transform:rotate(-8deg);animation:sello .55s ease both}
.sello.pasa{color:var(--ok);border-color:var(--ok)}
.sello.bloq{color:var(--bad);border-color:var(--bad)}
/* quiz / decisión */
.opc{display:block;width:100%;text-align:left;margin-bottom:12px;padding:16px 22px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:25px;transition:all .15s}
.opc:hover{background:var(--tintblue)}
.opc.bien{background:var(--okbg);border-color:var(--ok)}
.opc.mal{background:var(--badbg);border-color:var(--bad)}
.nodo-dec{font-family:var(--serif);font-size:44px;color:var(--navy);line-height:1.2;font-weight:800}
.rastro{font-size:20px;color:var(--muted)}
.chk{display:flex;gap:16px;align-items:flex-start;padding:12px 18px;border-radius:12px;border:1.5px solid var(--line-soft);background:var(--card);margin-bottom:10px;font-size:24px;cursor:pointer;transition:all .2s}
.chk.hecho{border-color:var(--ok);background:var(--okbg)}
.chk .cb{width:32px;height:32px;border:2.5px solid var(--navy);border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;margin-top:2px}
.chk.hecho .cb{background:var(--ok);border-color:var(--ok)}
.chk small{display:block;color:var(--muted);font-size:19px;margin-top:2px}
.leyenda{display:flex;gap:22px;font-size:20px;color:var(--muted);flex-wrap:wrap}
.leyenda i{display:inline-block;width:16px;height:16px;border-radius:5px;margin-right:7px;vertical-align:-2px}
.portada{display:flex;flex-direction:column;justify-content:center;height:100%}
.firma{position:absolute;left:0;right:0;bottom:0;height:120px;background:#0B1B5E;overflow:hidden}
.firma::before{content:"";position:absolute;right:-90px;top:-70px;width:340px;height:340px;border-radius:50%;background:#E82052}
.firma::after{content:"";position:absolute;left:-60px;bottom:-110px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.55),transparent 70%)}
.firma .vidrio{position:absolute;left:100px;top:30px;padding:14px 34px;border-radius:99px;color:#fff;font-size:24px;font-weight:600;background:rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(150%);border:1.5px solid rgba(255,255,255,.4);box-shadow:inset 3px 3px 8px rgba(255,255,255,.3),inset -3px -3px 8px rgba(255,255,255,.2);text-shadow:0 1px 6px rgba(0,0,0,.35);z-index:2}
@media print{#hud,#notas,#vista,#ayuda{display:none!important}}

/* ---- introducción: presentación, necesidad, qué es RAG ---- */
.yo-grid{display:grid;grid-template-columns:400px 1fr 400px;gap:60px;align-items:center;margin-top:50px}
.foto{width:390px;height:390px;border-radius:50%;object-fit:cover;border:8px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box;box-shadow:0 14px 40px var(--shadow)}
.card.qr{text-align:center;padding:24px}
.card.qr img{width:340px;height:340px;background:#fff;padding:12px;border-radius:14px;border:1px solid var(--line-soft)}
.card.qr p{font-size:26px;margin-top:12px;color:var(--navy)}
.card.qr p.muted{font-size:20px;color:var(--muted)}
ul.lista{list-style:none;display:flex;flex-direction:column;gap:16px}
ul.lista li{font-size:32px;line-height:1.35;padding-left:38px;position:relative}
ul.lista li::before{content:"";position:absolute;left:0;top:.5em;width:16px;height:16px;border-radius:50%;background:var(--grad)}
ul.lista.chica li{font-size:30px}
ol.lista li::before{display:none}
ol.lista.chica li{font-size:29px}
ol.lista li{padding-left:0}
.flujo-rag{display:flex;align-items:stretch;gap:12px;margin-top:10px}
.caja-rag{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:24px 24px 26px;box-shadow:0 8px 24px var(--shadow)}
.caja-rag .n{display:inline-block;font-family:var(--serif);font-weight:900;font-size:36px;color:var(--violet)}
.caja-rag h3{font-family:var(--serif);font-size:38px;color:var(--navy);margin:2px 0 10px}
.caja-rag p{font-size:25px;line-height:1.35;color:var(--ink)}
.caja-rag.clave{border-color:var(--violet);border-width:3px;background:var(--tintviolet)}
.flecha{align-self:center;font-size:44px;color:var(--violet);font-weight:700}
.rompe{display:flex;flex-direction:column;gap:2px;padding:14px 22px;border-radius:14px;border:1.5px solid var(--line-soft);background:var(--card)}
.rompe b{font-size:29px;color:var(--navy)}
.rompe span{font-size:25px;color:var(--bad);font-weight:600}

/* ---- árbol de decisión completo (diagrama) ---- */
:root{--ad-q:#FFF3C4;--ad-qs:#E8D38A;--ad-si:#CFF5DA;--ad-no:#FFCFD6;--ad-h:#BFE3FF;--ad-hs:#8EC5F0;--ad-est:#E6D5FF;--ad-ln:#1A1A1A}
:root[data-tema="oscuro"]{--ad-q:#4a3f14;--ad-qs:#8a7625;--ad-si:#17452a;--ad-no:#5a1f27;--ad-h:#17395a;--ad-hs:#4a86c4;--ad-est:#3d2a73;--ad-ln:#dbe5ff}
.ad-lienzo{background-image:radial-gradient(circle,var(--line) 1.4px,transparent 1.6px);background-size:30px 30px;border-radius:18px;margin-top:-6px}
.ad-lienzo svg{display:block;font-family:var(--sans)}
.adl{fill:none;stroke:var(--ad-ln);stroke-width:2.4;stroke-linecap:round}
.ad-q polygon{fill:var(--ad-q);stroke:var(--ad-q);stroke-width:16;stroke-linejoin:round}
.ad-q text{font-size:21px;fill:var(--ink);text-anchor:middle}
.ad-b circle{stroke:none}.ad-b.si circle{fill:var(--ad-si)}.ad-b.no circle{fill:var(--ad-no)}
.ad-b text{font-size:19px;font-weight:800;fill:var(--ink);text-anchor:middle}
.ad-h rect{fill:var(--ad-h);stroke:var(--ad-hs);stroke-width:2}
.ad-h.est rect{fill:var(--ad-est);stroke:var(--violet);stroke-width:4}
.ad-h text{text-anchor:middle;fill:var(--ink)}
.ad-h .t1{font-size:18px;font-weight:800;font-family:var(--serif)}
.ad-h .t2{font-size:15px;fill:var(--muted)}
.ad-n rect{fill:var(--card);stroke:var(--line);stroke-width:2;stroke-dasharray:8 6}
.ad-nota{font-size:25px;line-height:1.4;color:var(--ink);font-family:var(--sans)}
.ad-nota b{color:var(--navy)}

/* ---- panel de notas / guion ---- */
#notas .np-cab{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}
#notas .np-tabs{display:flex;gap:6px;flex:none}
#notas .np-tabs button{background:transparent;border:1px solid rgba(205,214,255,.35);color:#dbe5ff;border-radius:8px;padding:3px 12px;font-size:15px}
#notas .np-tabs button.on{background:var(--violet);border-color:var(--violet);color:#fff}
#notas .np-cuerpo p{margin:0 0 .7em}
#notas.guion{max-height:46vh;font-size:25px;line-height:1.6}
#notas.guion .np-cuerpo{color:#f4f6ff}
#hud button.act{background:var(--violet);border-color:var(--violet);color:#fff}

/* definiciones y glosario */
.ej{margin-top:14px;padding:14px 18px;border-left:5px solid var(--violet);background:rgba(124,58,237,.07);border-radius:8px;font-size:26px;line-height:1.4}
.formula{font-family:var(--mono,monospace);font-size:34px;font-weight:700;margin:6px 0 12px;color:var(--navy)}
.tabla-med{width:100%;border-collapse:collapse;font-size:32px}
.tabla-med th{font-size:20px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 14px;border-bottom:2px solid var(--line)}
.tabla-med td{padding:14px;border-bottom:1px solid var(--line)}
.tabla-med tr.total td{font-size:28px;background:var(--tintviolet);border-bottom:0}
.gl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gl{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.gl b{font-family:var(--serif);font-size:25px;color:var(--violet)}
.gl span{font-size:19px;line-height:1.3;color:var(--ink)}

.fam .atras .hint{display:block;font-size:15px;color:var(--muted);margin-bottom:8px}
.fam .atras h4{font-family:var(--serif);font-size:26px;color:var(--navy);margin-bottom:6px}
.fam .atras p{font-size:20px;line-height:1.35}
.leer{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.leer .card{font-size:22px;line-height:1.4;padding:16px 22px}

.repo-card{display:flex;align-items:center;gap:26px;background:var(--tintviolet);border:1.5px solid var(--line);border-radius:18px;padding:14px 24px;margin-bottom:16px}
.repo-card img{width:132px;height:132px;border-radius:10px}
.repo-url{font-family:var(--serif);font-size:38px;font-weight:700;color:var(--violet);text-decoration:none}
.tabla-nb{width:100%;border-collapse:collapse;font-size:19px;line-height:1.3}
.tabla-nb th{font-size:17px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 12px;border-bottom:2px solid var(--line)}
.tabla-nb td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tabla-nb td.n{font-family:var(--serif);font-weight:900;font-size:30px;color:var(--violet)}
.tabla-nb td b{font-size:21px;display:block}
.colab-url{display:block;font-family:var(--mono,monospace);font-size:14px;color:var(--blue);word-break:break-all;margin-top:4px;text-decoration:none}
.colab-url .base{color:var(--muted)}

#b-notas,#b-guion,#b-reloj,#reloj{display:none!important}

/* tema DSRP */
.firma{background:#001C59}
.btn.pri,.btn.sel{background:#E82052;border-color:#E82052}

<script id="datos" type="application/json">{"docs":[{"id":"P01","titulo":"Vacaciones","texto":"Los colaboradores acumulan 30 días calendario de descanso remunerado por año de servicio. El periodo puede fraccionarse en bloques de mínimo 7 días con aprobación del jefe directo.","tipo":"politica"},{"id":"P02","titulo":"Teletrabajo","texto":"Se permite el trabajo remoto hasta tres días por semana. El día presencial obligatorio es el martes. Se requiere conexión VPN corporativa y equipo entregado por la empresa.","tipo":"politica"},{"id":"P03","titulo":"Devoluciones","texto":"El cliente puede devolver un producto dentro de 30 días desde la compra, con boleta y empaque sellado. Los productos de electrónica tienen un plazo de 15 días. El reembolso se realiza al mismo medio de pago.","tipo":"politica"},{"id":"P04","titulo":"Viáticos","texto":"Los gastos de viaje se reembolsan con comprobante dentro de 10 días hábiles. El tope diario de alimentación es 120 soles. Los viajes internacionales requieren aprobación de la gerencia del área.","tipo":"politica"},{"id":"P05","titulo":"Licencias","texto":"La licencia por paternidad es de 10 días calendario y la de maternidad de 98 días. Se solicita a Recursos Humanos con el certificado médico correspondiente.","tipo":"politica"},{"id":"P06","titulo":"Seguridad de la información","texto":"Las claves de acceso deben tener 14 caracteres y cambiarse cada 90 días. Todo acceso a sistemas internos exige verificación en dos pasos (MFA). Está prohibido compartir credenciales.","tipo":"politica"},{"id":"P07","titulo":"Código de conducta: obsequios","texto":"No se aceptan obsequios, invitaciones ni atenciones de proveedores con valor mayor a 100 soles. Todo ofrecimiento debe reportarse al área de Cumplimiento.","tipo":"politica"},{"id":"P08","titulo":"Proceso de compras","texto":"Toda compra sobre 5,000 soles exige tres cotizaciones comparables y la aprobación del comité de compras. Las compras menores se tramitan con una sola cotización.","tipo":"politica"},{"id":"P09","titulo":"Capacitación","texto":"Cada colaborador dispone de un presupuesto anual de 2,000 soles para cursos, certificaciones y congresos, previa autorización de su jefe directo.","tipo":"politica"},{"id":"P10","titulo":"Horario y tardanzas","texto":"El horario de oficina es de 9:00 a 18:00. Las tardanzas acumuladas superiores a 60 minutos en el mes se descuentan de la remuneración y tres tardanzas generan una amonestación escrita.","tipo":"politica"},{"id":"T01","titulo":"ERR-5021 pasarela de pagos","texto":"ERR-5021: fallo de conexión con la pasarela de pagos PayHub. Reintentar tras 30 segundos; si persiste, escalar al equipo Pagos con el identificador de la transacción.","tipo":"tecnico"},{"id":"T02","titulo":"ERR-7714 inventario","texto":"ERR-7714: inventario desincronizado entre la tienda y el almacén central. Ejecutar la reconciliación nocturna con el job REC-NIGHT-02 y validar el stock al día siguiente.","tipo":"tecnico"},{"id":"T03","titulo":"ERR-1003 sesión","texto":"ERR-1003: el token de sesión de la aplicación móvil expiró. El usuario debe volver a iniciar sesión; no requiere escalamiento.","tipo":"tecnico"},{"id":"T04","titulo":"SKU-48213 licuadora","texto":"SKU-48213: Licuadora Oster ProBlend de 1.5 litros, línea hogar. Garantía de 24 meses con boleta de compra.","tipo":"producto"},{"id":"T05","titulo":"SKU-90117 laptop","texto":"SKU-90117: Laptop Lenovo IdeaPad 5 con 16 GB de RAM, línea electrónica. Garantía de 12 meses con boleta de compra.","tipo":"producto"},{"id":"T06","titulo":"SKU-33502 refrigeradora","texto":"SKU-33502: Refrigeradora Samsung de 380 litros con tecnología inverter, línea blanca. Garantía de 36 meses con boleta de compra.","tipo":"producto"},{"id":"T07","titulo":"RB-204 certificados TLS","texto":"RB-204: procedimiento para rotar los certificados TLS del balanceador. Se ejecuta en ventana de mantenimiento, con aprobación del responsable de Infraestructura y validación posterior de los endpoints.","tipo":"te  penalidad equivalente al 2% del valor del envío afectado. La penalidad acumulada no podrá exceder el 10% del valor del envío. Las penalidades se descontarán de la siguiente factura. No se aplican penalidades cuando el retraso se deba a caso fortuito o a fuerza mayor debidamente sustentada."},{"cap":"II. Condiciones económicas","num":"4","titulo":"Tarifas y reajuste","resumen":"Cómo se calcula la tarifa y cuánto puede subir cada año.","texto":"La tarifa se calcula por kilogramo transportado según la zona de destino y consta en el anexo de tarifas. Cada doce meses la tarifa se reajusta según la variación del índice de precios al consumidor, con un tope máximo de 4%. Cualquier otro incremento requiere acuerdo escrito de ambas partes."},{"cap":"II. Condiciones económicas","num":"5","titulo":"Facturación y pago","resumen":"Emisión de facturas y plazo de pago.","texto":"El Proveedor emitirá una factura mensual por los servicios prestados, adjuntando las guías de remisión firmadas. La Empresa pagará dentro de los 45 días calendario siguientes a la recepción conforme de la factura. Los pagos fuera de plazo generan interés moratorio a la tasa legal."},{"cap":"II. Condiciones económicas","num":"6","titulo":"Seguros","resumen":"Cobertura del seguro de transporte y deducible.","texto":"El Proveedor mantendrá un seguro de transporte que cubra pérdida, robo o daño de la mercadería hasta el 100% del valor declarado en la orden de transporte. El deducible a cargo del Proveedor es de 1% del valor del siniestro. El certificado de la póliza se entregará a la Empresa antes del primer despacho."},{"cap":"III. Aspectos legales","num":"7","titulo":"Confidencialidad","resumen":"Reserva de la información comercial y su duración.","texto":"Las partes mantendrán en reserva la información comercial, los volúmenes de venta y las tarifas a las que accedan por este contrato. La obligación de confidencialidad se mantiene durante cinco años después de terminado el contrato. Solo se puede revelar información por mandato de autoridad competente."},{"cap":"III. Aspectos legales","num":"8","titulo":"Terminación","resumen":"Cómo y cuándo puede terminar el contrato.","texto":"Cualquiera de las partes puede terminar el contrato sin expresión de causa con un aviso escrito de 60 días. La Empresa puede resolverlo de inmediato ante incumplimientos graves, como la pérdida reiterada de mercadería o la falta de seguro vigente. Al terminar, el Proveedor entregará toda la documentación pendiente."},{"cap":"III. Aspectos legales","num":"9","titulo":"Subcontratación","resumen":"Condiciones para subcontratar el servicio.","texto":"El Proveedor no podrá subcontratar total ni parcialmente el servicio sin autorización escrita previa de la Empresa. El Proveedor sigue siendo responsable frente a la Empresa por los actos de sus subcontratistas, incluidos los retrasos y los daños."},{"cap":"III. Aspectos legales","num":"10","titulo":"Disposiciones generales","resumen":"Notificaciones, ley aplicable y solución de controversias.","texto":"Las comunicaciones entre las partes se enviarán a los correos electrónicos designados en el anexo de contactos. Cualquier controversia se someterá a arbitraje de derecho ante la Cámara de Comercio de Lima. El contrato se rige por las leyes de la República del Perú."}],"palabras":["Objeto.","El","Proveedor","se","obliga","a","transportar","la","mercadería","que","Andina","Retail","le","entregue","en","el","almacén","central","de","Lurín","hacia","las","tiendas","de","Lima,","Arequipa","y","Cusco.","El","servicio","incluye","la","carga,","el","traslado","y","la","descarga","en","el","punto","de","entrega","indicado","por","la","Empresa.","No","incluye","el","almacenamiento","prolongado","ni","el","armado","de","productos.","Cada","despacho","se","solicita","mediante","una","orden","de","transporte","emitida","por","la","Empresa.","Plazos","de","entrega.","La","entrega","en","Lima","Metropolitana","se","realiza","dentro","de","48","horas","desde","la","r /* Métricas de recuperación: réplica exacta de las funciones de los notebooks (mismo desempate estable). */
const Metricas = (function (D) {
  const IDS = D.docs.map(d => d.id);
  const TIPOS = ["semantica", "exacta", "mixta"];

  function minmax(a) {
    let mn = Infinity, mx = -Infinity;
    for (const v of a) { if (v < mn) mn = v; if (v > mx) mx = v; }
    const d = mx - mn + 1e-9;
    return a.map(v => (v - mn) / d);
  }
  // argsort descendente estable (empates por índice), como np.argsort(-x, kind="stable")
  const ordenDesc = a => a.map((_, i) => i).sort((i, j) => (a[j] - a[i]) || (i - j));

  const rDenso = c => ordenDesc(c.denso).map(i => IDS[i]);
  const rBm25 = c => ordenDesc(c.bm25).filter(i => c.bm25[i] > 0).map(i => IDS[i]);
  function rrf(listas, k = 60) {
    const acum = new Map();
    for (const lista of listas) lista.forEach((d, pos) => acum.set(d, (acum.get(d) || 0) + 1 / (k + pos + 1)));
    const claves = [...acum.keys()];
    return { orden: claves.map((d, i) => [d, i]).sort((a, b) => (acum.get(b[0]) - acum.get(a[0])) || (a[1] - b[1])).map(x => x[0]), acum };
  }
  const rRrf = c => rrf([rDenso(c), rBm25(c)]).orden;
  function puntajesConvexa(c, alpha) {
    const a = minmax(c.denso), b = minmax(c.bm25);
    return a.map((v, i) => alpha * v + (1 - alpha) * b[i]);
  }
  const rConvexa = (c, alpha) => ordenDesc(puntajesConvexa(c, alpha)).map(i => IDS[i]);

  function evaluar(fn, consultas) {
    const por = {};
    for (const c of consultas) {
      const r = fn(c), idx = r.findIndex(d => c.rel.includes(d)), pos = idx < 0 ? null : idx + 1;
      (por[c.tipo] = por[c.tipo] || []).push({ hit: pos !== null && pos <= 3 ? 1 : 0, mrr: pos ? 1 / pos : 0 });
    }
    const prom = xs => xs.reduce((s, x) => s + x, 0) / xs.length;
    const out = {};
    for (const t of TIPOS) if (por[t]) out[t] = { hit3: prom(por[t].map(x => x.hit)), mrr: prom(por[t].map(x => x.mrr)) };
    out.promedio = { hit3: prom(TIPOS.map(t => out[t].hit3)), mrr: prom(TIPOS.map(t => out[t].mrr)) };
    return out;
  }
  const subconjunto = nombre => nombre === "todo" ? D.consultas : D.consultas.filter(c => c.split === nombre);
  const metodo = {
    denso: rDenso, bm25: rBm25, rrf: rRrf,
    convexa: alpha => (c => rConvexa(c, alpha)),
  };
  return { IDS, TIPOS, minmax, ordenDesc, rDenso, rBm25, rrf, rRrf, rConvexa, puntajesConvexa, evaluar, subconjunto, metodo };
});
if (typeof module !== "undefined") module.exports = Metricas;

/* gráfico de barras agrupadas con transición: grupos = [{etq, barras:[{etq,valor,color}]}] */
function barrasAgrupadas(cont, grupos, { max = 1, alto = 330, fmt = f2 } = {}) {

    <div style="flex:1;display:flex;flex-direction:column;align-items:center">

}

      <div class="fila" id="med-btns">${[1, 2, 3, 4, 5].map(p => `<button class="btn" data-p="${p}">${p}.º</button>`).join("")}</div>
      <div id="med-lista" style="margin-top:20px"></div></div>
    <div class="col" style="justify-content:center;gap:20px">
      <div class="card"><div class="muted" style="font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.08em">hit@3</div>
        <div id="med-hit" style="font-size:44px;font-weight:800"></div>
        <p class="muted" style="font-size:22px">¿Hay un documento correcto entre los 3 primeros?</p></div>
      <div class="card"><div class="muted" style="font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.08em">MRR (rango recíproco)</div>
        <div id="med-mrr" class="num" style="font-size:72px;line-height:1.1"></div>
        <p class="muted" style="font-size:22px">1 ÷ posición del primer correcto. Premia que quede arriba.</p></div></div></div>`;
  const pintar = p => {
    $$("#med-btns .btn", el).forEach(b => b.classList.toggle("sel", +b.dataset.p === p));
    $("#med-lista", el).innerHTML = [1, 2, 3, 4, 5].map(i => `<div class="res ${i === p ? "correcto" : ""}" style="grid-template-columns:44px 1fr"><span class="pos">${i}</span><span>${i === p ? "✔ Documento correcto" : "Otro documento"}</span></div>`).join("");
    const hit = p <= 3;
    $("#med-hit", el).innerHTML = hit ? `<span class="ok">✔ acierta</span>` : `<span class="bad">✘ falla</span>`;

/* ---------- W: laboratorio de consultas ---------- */
function wLab(root) {
  const el = $("#w-lab", root);
  const grupos = M.TIPOS.map(t => `<optgroup label="${TIPO_ES[t]}">${D.consultas.map((c, i) => c.tipo === t ? `<option value="${i}">${esc(c.q)}</option>` : "").join("")}</optgroup>`).join("");
  el.innerHTML = `<div class="fila"><label class="l">Pregunta</label><select class="sel" id="lab-q">${grupos}</select>
      <label class="l">Peso del significado (α) <b id="lab-av" style="color:var(--violet)">0.7</b></label><input type="range" id="lab-a" min="0" max="1" step="0.1" value="0.7"></div>
    <div class="muted" style="font-size:21px;margin-top:6px">α: <b>0</b> = solo palabras (BM25) · <b>1</b> = solo significado (vectorial). Los puntajes no se comparan: coseno ~0–1, BM25 sin tope; el híbrido los pasa a 0–1 antes de mezclar.</div><div id="lab-correcto" class="muted" style="font-size:22px;margin-top:8px"></div>
    <div class="lab-cols" id="lab-cols"></div>`;
  const render = () => {
    const c = D.consultas[+$("#lab-q", el).value], a = parseFloat($("#lab-a", el).value);
    $("#lab-av", el).textContent = a.toFixed(1);
    $("#lab-correcto", el).innerHTML = `Documento correcto: ${c.rel.map(docLinea).join(" · ")}`;
    const hib = M.puntajesConvexa(c, a);
    const cols = [
      { k: "denso", lista: M.rDenso(c), val: id => c.denso[M.IDS.indexOf(id)], vacio: null, fmt: v => v.toFixed(2) },
      { k: "bm25", lista: M.rBm25(c), val: id => c.bm25[M.IDS.indexOf(id)], vacio: "Sin coincidencias: ningún documento comparte una palabra con la pregunta.", fmt: v => v.toFixed(1) },
      { k: "hib", lista: M.rConvexa(c, a), val: id => hib[M.IDS.indexOf(id)], vacio: null, fmt: v => v.toFixed(2) },
    ];
    $("#lab-cols", el).innerHTML = cols.map(col => {
      const top = col.lista.slice(0, 5), mx = top.length ? Math.max(...top.map(col.val), 1e-9) : 1;
      const pos = col.lista.findIndex(d => c.rel.includes(d)) + 1;
      const veredicto = pos === 0 ? `<span class="bad">✘ el correcto no aparece</span>` : pos <= 3 ? `<span class="ok">✔ correcto en el puesto ${pos}</span>` : `<span class="warnc">⚠ correcto en el puesto ${pos} (fuera del top-3)</span>`;
      return `<div class="lab-col"><h4><span class="dot" style="background:${COLOR[col.k]}"></span>${col.k === "hib" ? `Híbrido α=${a.toFixed(1)}` : NOMBRE[col.k]}</h4>
        ${top.length ? top.map((id, i) => `<div class="res entra ${c.rel.includes(id) ? "correcto" : ""}" style="--i:${i}"><span class="pos">${i + 1}</span>
          <span class="nm"><b>${id}</b><small>${esc(DOC[id].titulo)}</small></span>
          <span><div class="mini-barra"><i style="width:${Math.max(4, col.val(id) / mx * 100)}%;background:${COLOR[col.k]}"></i></div><small class="muted" style="font-size:16px">${col.fmt(col.val(id))}</small></span></div>`).join("") : `<div class="vacio">${col.vacio}</div>`}
        <div class="veredicto">${veredicto}</div></div>`;
    }).join("");
  };
  $("#lab-q", el).onchange = render;
  $("#lab-a", el).oninput = render;
  $("#lab-q", el).value = D.consultas.findIndex(c => c.q === "¿Puedo trabajar desde mi casa?");
  render();
  root._lab = { elegir: q => { $("#lab-q", el).value = D.consultas.findIndex(c => c.q === q); render(); } };
}

      <span class="muted" style="font-size:22px">Métrica</span><button class="btn peq sel" data-m="hit3">hit@3</button><button class="btn peq" data-m="mrr">MRR</button>
      <span class="muted" style="font-size:22px;margin-left:24px">Preguntas</span>
      <button class="btn peq sel" data-s="todo">todas (33)</button><button class="btn peq" data-s="dev">ajuste (17)</button><button class="btn peq" data-s="test">prueba (16)</button></div>
    <div id="barras-g"></div><div style="margin-top:12px">${leyenda([[COLOR.denso, "Vectorial"], [COLOR.bm25, "BM25"], [COLOR.rrf, "Fusión simple 1:1"], [COLOR.hib, "Híbrido α=0.7"]])}</div>
    <div class="leer"><div class="card"><b>Cómo leerlo.</b> Cada <b>grupo</b> de barras es un tipo de pregunta; cada <b>color</b>, un método. La <b>altura</b> es el hit@3 (qué fracción de las preguntas tiene el correcto entre los 3 primeros; 1.00 = todas) o el MRR, según el botón.<br><span class="muted"><b>Semántica</b>: se parafrasea («trabajar desde mi casa»). <b>Exacta</b>: lleva un código («ERR-5012»). <b>Mixta</b>: ambas cosas. <b>Promedio de tipos</b>: el promedio de los tres grupos.</span></div>

    barrasAgrupadas($("#barras-g", el), ["semantica", "exacta", "mixta", "promedio"].map(t => ({

    })), { alto: 260 });
    const nm = st.m === "hit3" ? "hit@3" : "MRR", c = { semantica: "semánticas", exacta: "exactas" };
    $("#barras-lee", el).innerHTML = `<b>Qué mirar (${nm}, ${st.s === "todo" ? "33 preguntas" : st.s === "dev" ? "17 de ajuste" : "16 de prueba"}).</b> El <b>vectorial</b> saca ${f2(res.denso.semantica[st.m])} en semánticas pero ${f2(res.denso.exacta[st.m])} en exactas. <b>BM25</b>, al revés: ${f2(res.bm25.semantica[st.m])} en semánticas y ${f2(res.bm25.exacta[st.m])} en exactas. En el <b>promedio</b> (${f2(res.denso.promedio[st.m])} y ${f2(res.bm25.promedio[st.m])}) los dos parecen parecidos, pero fallan en sitios opuestos: por eso el promedio engaña.`;
  };
  $$("[data-m]", el).forEach(b => b.onclick = () => { st.m = b.dataset.m; $$("[data-m]", el).forEach(x => x.classList.toggle("sel", x === b)); render(); });
  $$("[data-s]", el).forEach(b => b.onclick = () => { st.s = b.dataset.s; $$("[data-s]", el).forEach(x => x.classList.toggle("sel", x === b)); render(); });

/* ---------- W: RRF paso a paso ---------- */
function wRrf(root) {
  const el = $("#w-rrf", root);
  const opciones = D.consultas.map((c, i) => [c, i]).filter(([c]) => ["¿Puedo trabajar desde mi casa?", "Falla la pasarela de pagos con ERR-5021, ¿cómo lo resuelvo?", "ERR-5012", "¿Cuántos días libres pagados tengo cada año?"].includes(c.q));
  el.innerHTML = `<div class="fila"><label class="l">Pregunta</label><select class="sel" id="rrf-q">${opciones.map(([c, i]) => `<option value="${i}">${esc(c.q)}</option>`).join("")}</select>
      <button class="btn pri" id="rrf-sig">Siguiente paso ▸</button><button class="btn" id="rrf-rep">↺</button></div>
    <div id="rrf-formula" class="card" style="margin-top:14px;font-size:26px">1. Cada buscador entrega su lista ordenada.</div>
    <div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:14px" id="rrf-cols"></div>
    <p class="muted" style="font-size:22px;margin-top:14px"><b>Esto es RRF</b> (<i>Reciprocal Rank Fusion</i>), una fórmula que mezcla dos listas. <b>No es un reranker</b> (un 2.º modelo que lee pregunta y documento y reordena), <b>ni MMR</b> (que diversifica resultados), <b>ni MRR</b> (que es una métrica para medir).</p>`;
  let paso = 0;
  const msg = [
    "1. Cada buscador entrega su <b>lista ordenada</b>. BM25 solo lista lo que coincide.",
    "2. Cada documento suma <b>1 ÷ (60 + posición)</b> por cada lista donde aparece: el 1.º suma 1/61 = 0.0164; el 2.º, 1/62 = 0.0161… Importa la posición, no el puntaje.",
    "3. Se <b>suman</b> los aportes y se reordena: los documentos que ambas listas comparten suben.",
  ];
  const render = () => {
    const c = D.consultas[+$("#rrf-q", el).value];
    const A = M.rDenso(c).slice(0, 5), B = M.rBm25(c).slice(0, 5);
    const { orden, acum } = M.rrf([M.rDenso(c), M.rBm25(c)]);
    const aporte = (lista, id) => { const p = lista.indexOf(id); return p < 0 ? 0 : 1 / (60 + p + 1); };
    const fila = (id, i, lista) => `<div class="res ${c.rel.includes(id) ? "correcto" : ""}" style="grid-template-columns:36px 1fr 130px"><span class="pos">${i + 1}</span><span class="nm"><b>${id}</b><small>${esc(DOC[id].titulo)}</small></span><span class="mono" style="font-size:20px;opacity:${paso >= 1 ? 1 : 0};transition:opacity .5s">+${(1 / (60 + i + 1)).toFixed(4)}</span></div>`;
    const fusion = orden.slice(0, 5).map((id, i) => `<div class="res ${c.rel.includes(id) ? "correcto" : ""}" style="grid-template-columns:36px 1fr 150px"><span class="pos">${i + 1}</span><span class="nm"><b>${id}</b><small>${esc(DOC[id].titulo)}</small></span><span class="mono" style="font-size:20px">${paso >= 2 ? acum.get(id).toFixed(4) : "…"}</span></div>`).join("");
    $("#rrf-formula", el).innerHTML = msg[Math.min(paso, 2)];
    $("#rrf-cols", el).innerHTML = `<div><h4 style="font-family:var(--serif);font-size:28px;color:var(--c-denso)">Vectorial</h4>${A.map((id, i) => fila(id, i)).join("")}</div>
      <div><h4 style="font-family:var(--serif);font-size:28px;color:var(--c-bm25)">BM25</h4>${B.length ? B.map((id, i) => fila(id, i)).join("") : `<div class="vacio">Sin coincidencias</div>`}</div>
      <div style="opacity:${paso >= 2 ? 1 : .25};transition:opacity .5s"><h4 style="font-family:var(--serif);font-size:28px;color:var(--c-rrf)">Fusión</h4>${fusion}</div>`;
  };
  $("#rrf-sig", el).onclick = () => { paso = Math.min(paso + 1, 2); render(); };
  $("#rrf-rep", el).onclick = () => { paso = 0; render(); };
  $("#rrf-q", el).onchange = () => { paso = 0; render(); };
  render();
}

/* ---------- W: calibrar α (ajuste vs prueba) ---------- */
function wAlfa(root) {
  const el = $("#w-alfa", root);
  el.innerHTML = `<div class="grid" style="grid-template-columns:1.15fr 1fr;gap:34px">
    <div><div class="fila"><label class="l">α (peso del significado) <b id="al-v" style="color:var(--violet);font-size:30px">0.7</b></label><input type="range" id="al-a" min="0" max="1" step="0.1" value="0.7">
        <button class="btn peq" id="al-mejor">Elegir el mejor en ajuste</button></div>
      <svg id="al-svg" viewBox="0 0 760 420" style="width:100%;margin-top:6px"></svg>
      ${leyenda([["#0051FA", "Semánticas"], ["#d97706", "Exactas"], ["#64748b", "Mixtas"], ["#E82052", "Promedio"]])}
      <p class="muted" style="font-size:21px;margin-top:6px">MRR sobre las 17 preguntas de <b>ajuste</b>. α=0 es solo BM25 · α=1 es solo vectorial. La mezcla es α·coseno + (1−α)·BM25, ambos en 0–1.</p></div>
    <div><button class="btn pri" id="al-probar" style="font-size:26px">Fijar α y probar en las 16 preguntas de prueba ▸</button>
      <div id="al-test" style="margin-top:18px"></div></div></div>`;
  const dev = M.subconjunto("dev"), test = M.subconjunto("test");
  const alfas = Array.from({ length: 11 }, (_, i) => i / 10);
  const curva = alfas.map(a => M.evaluar(M.metodo.convexa(a), dev));
  const series = [["semantica", "#0051FA"], ["exacta", "#d97706"], ["mixta", "#64748b"], ["promedio", "#E82052"]];
  const X = a => 70 + a * 640, Y = v => 370 - v * 330;
  const pintar = () => {
    const a = parseFloat($("#al-a", el).value);
    $("#al-v", el).textContent = a.toFixed(1);
    let s = [0, .25, .5, .75, 1].map(v => `<line x1="70" x2="710" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-soft)"/><text x="58" y="${Y(v) + 5}" text-anchor="end" font-size="16" fill="var(--muted)">${v}</text>`).join("");
    s += alfas.map(v => `<text x="${X(v)}" y="398" text-anchor="middle" font-size="16" fill="var(--muted)">${v.toFixed(1)}</text>`).join("");
    for (const [k, col] of series) {
      const pts = curva.map((r, i) => `${X(alfas[i])},${Y(r[k].mrr)}`).join(" ");
      s += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${k === "promedio" ? 6 : 3.5}" stroke-linejoin="round" opacity="${k === "promedio" ? 1 : .85}"/>`;
    }
    s += `<line x1="${X(a)}" x2="${X(a)}" y1="30" y2="372" stroke="var(--violet)" stroke-width="3" stroke-dasharray="8 6"/>`;
    const r = curva[Math.round(a * 10)];
    s += `<text x="${Math.min(X(a) + 10, 600)}" y="52" font-size="19" font-weight="700" fill="var(--violet)">promedio ${f2(r.promedio.mrr)}</text>`;
    $("#al-svg", el).innerHTML = s;
  };
  $("#al-a", el).oninput = () => { pintar(); $("#al-test", el).innerHTML = ""; };
  $("#al-mejor", el).onclick = () => {
    const r2 = x => Math.round(x * 100) / 100;   // igual que el notebook: empata a 2 decimales y gana el primero
    let b = 0; curva.forEach((r, i) => { if (r2(r.promedio.mrr) > r2(curva[b].promedio.mrr)) b = i; });
    $("#al-a", el).value = alfas[b]; pintar();
  };
  $("#al-probar", el).onclick = () => {
    const a = parseFloat($("#al-a", el).value);
    const r = { denso: M.evaluar(M.metodo.denso, test), bm25: M.evaluar(M.metodo.bm25, test), rrf: M.evaluar(M.metodo.rrf, test), hib: M.evaluar(M.metodo.convexa(a), test) };
    const cont = $("#al-test", el);
    cont.innerHTML = `<div class="muted" style="font-size:22px;margin-bottom:6px">MRR promedio en prueba (preguntas que α nunca vio)</div><div id="al-barras"></div>
      <div class="card" style="margin-top:10px;font-size:22px" id="al-lectura"></div>`;
    barrasAgrupadas($("#al-barras", cont), [{ etq: "Prueba", barras: ["denso", "bm25", "rrf", "hib"].map(k => ({ valor: r[k].promedio.mrr, color: COLOR[k] })) }], { alto: 230 });
    const d = r.hib.promedio.mrr - r.rrf.promedio.mrr;
    const hits = fn => test.filter(c => fn(c).slice(0, 3).some(x => c.rel.includes(x))).length;
    const dq = hits(M.metodo.convexa(a)) - hits(M.metodo.rrf);
    $("#al-lectura", cont).innerHTML = `Calibrar vs fusión simple: <b>${d >= 0 ? "+" : ""}${f2(d)} MRR</b> · <b>${dq >= 0 ? "+" : ""}${dq}</b> de 16 preguntas en hit@3. <br><span class="muted">Casi toda la mejora viene de <b>fusionar</b>; calibrar afina y no es concluyente con tan pocas preguntas.</span>`;
  };
  pintar();
}

  el.innerHTML = `<div class="grid" style="grid-template-columns:1fr 1.1fr;gap:34px">
    <div class="card" style="border-color:var(--bad)"><h3 style="color:var(--bad)">RAG de texto: filas «parecidas»</h3>

      ${R.rag_filas.map((f, i) => `<div class="res entra" style="--i:${i};grid-template-columns:1fr 70px;font-size:19px"><span>${esc(f.frase)}</span><b style="text-align:right">${f.unidades}</b></div>`).join("")}
      <div style="font-size:30px;margin-top:10px">Suma de lo recuperado: <b class="bad" id="sq-rag">0</b></div></div>
    <div class="card" style="border-color:var(--ok)"><h3 style="color:var(--ok)">SQL: se calcula sobre toda la tabla</h3>
      <div class="fila" style="gap:10px">
        <select class="sel" id="sq-agg" style="font-size:20px"><option>SUM</option><option>AVG</option></select>
        <select class="sel" id="sq-med" style="font-size:20px"><option value="unidades">unidades</option><option value="monto">monto (soles)</option></select>
        <select class="sel" id="sq-t" style="font-size:20px"><option value="">todas las tiendas</option>${uniq("tienda").map(x => `<option>${x}</option>`).join("")}</select>
        <select class="sel" id="sq-c" style="font-size:20px"><option value="">todas las categorías</option>${uniq("categoria").map(x => `<option>${x}</option>`).join("")}</select>
        <select class="sel" id="sq-m" style="font-size:20px"><option value="">todos los meses</option>${uniq("mes").map(x => `<option>${x}</option>`).join("")}</select></div>
      <pre id="sq-sql" class="mono" style="background:var(--tintblue);padding:14px;border-radius:12px;margin-top:14px;font-size:19px;white-space:pre-wrap"></pre>
      <div style="font-size:30px;margin-top:8px">Resultado: <b class="ok" id="sq-res">–</b></div>
      <button class="btn peq" id="sq-demo" style="margin-top:12px">Resolver la pregunta del RAG ▸</button>
      <ul class="muted" style="font-size:20px;margin-top:12px;padding-left:24px;line-height:1.5"><li>Solo columnas y valores de una <b>lista blanca</b>.</li><li>Parámetros <code>?</code>: nunca texto del usuario pegado al SQL.</li><li>Usuario de <b>solo lectura</b> y límite de filas.</li></ul></div></div>`;
  const calcular = () => {
    const agg = $("#sq-agg", el).value, med = $("#sq-med", el).value, filt = { tienda: $("#sq-t", el).value, categoria: $("#sq-c", el).value, mes: $("#sq-m", el).value };
    const filas = V.filter(r => Object.entries(filt).every(([k, v]) => !v || r[k] === v));
    const vals = filas.map(r => r[med]), suma = vals.reduce((s, x) => s + x, 0);
    const res = agg === "SUM" ? suma : (vals.length ? suma / vals.length : 0);

    $("#sq-res", el).textContent = Math.round(res).toLocaleString("es-PE") + (filas.length ? "" : " (sin filas)");
  };
  $$("select", el).forEach(s => s.onchange = calcular);
  $("#sq-demo", el).onclick = () => { $("#sq-agg", el).value = "SUM"; $("#sq-med", el).value = "unidades"; $("#sq-t", el).value = ""; $("#sq-c", el).value = "electrónica"; $("#sq-m", el).value = "septiembre"; calcular(); };
  $("#sq-demo", el).click();
  root._sql = { animar: () => { const e = $("#sq-rag", el), fin = R.rag_suma, t0 = performance.now(); const paso = t => { const k = Math.min(1, (t - t0) / 900); e.textContent = Math.round(fin * k); if (k < 1) requestAnimationFrame(paso); else e.textContent = `${fin}  (real: ${R.sql_real})`; }; requestAnimationFrame(paso); } };
}

/* ---------- W: permisos (ACL) antes del ranking ---------- */
function wAcl(root) {
  const el = $("#w-acl", root), P = D.produccion, RES = new Set(P.restringidos);
  const opts = D.consultas.map((c, i) => `<option value="${i}">${esc(c.q)}</option>`).join("");
  el.innerHTML = `<div class="fila"><label class="l">Quién pregunta</label>
      <button class="btn peq sel" data-r="practicante">Practicante</button><button class="btn peq" data-r="compras">Compras</button>
      <label class="l" style="margin-left:18px"><input type="checkbox" id="ac-on" style="width:24px;height:24px;vertical-align:-5px"> Aplicar permisos <b>antes</b> de ordenar</label></div>
    <select class="sel" id="ac-q" style="margin-top:14px;font-size:21px">${opts}</select>
    <div class="grid" style="grid-template-columns:1.2fr 1fr;gap:30px;margin-top:16px"><div id="ac-lista"></div><div id="ac-info" class="col"></div></div>`;
  const st = { rol: "practicante" };
  const permitido = (id, rol) => !RES.has(id) || P.roles_contratos.includes(rol);
  const lista = (c, rol, on, k = 5) => {
    const pts = M.puntajesConvexa(c, 0.7).map((v, i) => (on && !permitido(M.IDS[i], rol)) ? -Infinity : v);
    return M.ordenDesc(pts).filter(i => isFinite(pts[i])).slice(0, k).map(i => M.IDS[i]);
  };
  const render = () => {
    const on = $("#ac-on", el).checked, c = D.consultas[+$("#ac-q", el).value], ids = lista(c, st.rol, on);
    $("#ac-lista", el).innerHTML = ids.map((id, i) => {
      const fuga = !permitido(id, st.rol);
      return `<div class="res entra ${fuga ? "" : ""}" style="--i:${i};grid-template-columns:44px 1fr 150px;${fuga ? "border-color:var(--bad);background:var(--badbg)" : ""}"><span class="pos">${i + 1}</span><span class="nm"><b>${id}</b><small>${esc(DOC[id].titulo)}</small></span>${fuga ? '<span class="bad">🔒 FUGA</span>' : RES.has(id) ? '<span class="ok">🔓 con permiso</span>' : '<span class="muted">público</span>'}</div>`;
    }).join("");
    let fugas = 0, restr = 0;
    D.consultas.forEach(q => lista(q, st.rol, on, 5).forEach(id => { if (!permitido(id, st.rol)) fugas++; }));
    D.consultas.forEach(q => lista(q, st.rol, false, 5).forEach(id => { if (RES.has(id)) restr++; }));
    $("#ac-info", el).innerHTML = `<div class="card"><div class="muted" style="font-size:21px;text-transform:uppercase;letter-spacing:.08em;font-weight:700">Prueba de fuga · 33 consultas · top-5</div>
      <div style="font-size:64px;font-family:var(--serif);font-weight:900" class="${fugas ? "bad" : "ok"}">${fugas} ${fugas ? "fugas" : "fugas ✔"}</div>
      <div class="muted" style="font-size:21px">Documentos restringidos que ${st.rol === "practicante" ? "un practicante recibiría sin filtro" : "ve Compras (tiene permiso)"}: ${restr}</div></div>
      <div class="card" style="font-size:22px;line-height:1.45">Filtrar <b>después</b> de generar la respuesta ya es tarde: el contenido ya pasó por el modelo. El filtro va sobre los candidatos <b>antes</b> de ordenar.</div>`;
  };
  $$("[data-r]", el).forEach(b => b.onclick = () => { st.rol = b.dataset.r; $$("[data-r]", el).forEach(x => x.classList.toggle("sel", x === b)); render(); });
  $("#ac-on", el).onchange = render; $("#ac-q", el).onchange = render;
  $("#ac-q", el).value = D.consultas.findIndex(c => c.q === "CT-2024-0087");
  render();
}

/* ---------- W: abstención por umbral ---------- */
function wAbst(root) {
  const el = $("#w-abst", root), P = D.produccion, pts = P.abstencion;
  const ymax = Math.ceil(Math.max(...pts.map(p => p.bm25)) / 2) * 2 + 1;
  el.innerHTML = `<div class="grid" style="grid-template-columns:900px 1fr;gap:28px"><div>
      <svg id="ab-svg" viewBox="0 0 880 620" style="width:880px;background:var(--card);border:1.5px solid var(--line);border-radius:16px"></svg>
      ${leyenda([["var(--c-denso)", "en el corpus (●ajuste ○prueba)"], ["#94a3b8", "ajena (ceviche, Tokio…)"], ["var(--bad)", "casi del dominio ◆"]])}</div>
    <div class="col"><div class="card"><label class="l">τ · similitud vectorial máxima <b id="ab-tv" style="color:var(--violet)"></b></label><input type="range" id="ab-t" min="0.2" max="0.8" step="0.05" style="width:100%">
        <label class="l" style="margin-top:12px;display:block">β · puntaje BM25 máximo <b id="ab-bv" style="color:var(--violet)"></b></label><input type="range" id="ab-b" min="0" max="${ymax}" step="0.5" style="width:100%">
        <p class="muted" style="font-size:20px;margin:8px 0 12px"><b>τ (tau)</b>: umbral de similitud vectorial. <b>β (beta)</b>: umbral de BM25. El sistema se abstiene («no lo sé») si <b>ambas</b> señales quedan por debajo.</p>
        <button class="btn peq" id="ab-elegidos">Umbrales elegidos en ajuste (τ=${P.tau}, β=${P.beta})</button></div>
      <div id="ab-stats" class="card" style="font-size:22px;line-height:1.5"></div></div></div>`;
  const X = v => 50 + v * 800, Y = v => 540 - v / ymax * 490;
  const render = () => {
    const tau = parseFloat($("#ab-t", el).value), beta = parseFloat($("#ab-b", el).value);
    $("#ab-tv", el).textContent = tau.toFixed(2); $("#ab-bv", el).textContent = beta.toFixed(1);
    let s = `<rect x="50" y="${Y(beta)}" width="${X(tau) - 50}" height="${540 - Y(beta)}" fill="rgba(232,32,82,.16)" stroke="var(--violet)" stroke-dasharray="8 6"/>
      <text x="56" y="${Y(beta) - 10}" font-size="20" fill="var(--violet)" font-weight="800">ZONA DE ABSTENCIÓN</text>
      <line x1="50" y1="540" x2="850" y2="540" stroke="var(--line)"/><line x1="50" y1="40" x2="50" y2="540" stroke="var(--line)"/>
      <text x="450" y="600" text-anchor="middle" font-size="20" fill="var(--muted)">similitud vectorial máxima →</text>
      <text x="16" y="290" font-size="20" fill="var(--muted)" transform="rotate(-90 16 290)" text-anchor="middle">BM25 máximo →</text>`;
    s += [0, .25, .5, .75, 1].map(v => `<text x="${X(v)}" y="568" text-anchor="middle" font-size="17" fill="var(--muted)">${v}</text>`).join("");
    for (const p of pts) {
      const col = p.tipo === "en corpus" ? "var(--c-denso)" : p.tipo === "ajena" ? "#94a3b8" : "var(--bad)";
      const x = X(Math.max(0, p.denso)), y = Y(p.bm25);
      s += p.tipo === "casi del dominio" ? `<path d="M${x},${y - 11} L${x + 11},${y} L${x},${y + 11} L${x - 11},${y} Z" fill="${col}"><title>${esc(p.q)}</title></path>`
        : `<circle cx="${x}" cy="${y}" r="${p.split === "test" ? 7 : 9}" fill="${p.split === "test" ? "none" : col}" stroke="${col}" stroke-width="3"><title>${esc(p.q)} (${p.split})</title></circle>`;
    }
    $("#ab-svg", el).innerHTML = s;
    const abst = p => p.denso < tau && p.bm25 < beta;
    const acc = split => { const l = pts.filter(p => p.split === split); return l.filter(p => p.tipo === "en corpus" ? !abst(p) : abst(p)).length + "/" + l.length; };
    const casi = pts.filter(p => p.tipo === "casi del dominio"), casiResp = casi.filter(p => !abst(p)).length;
    $("#ab-stats", el).innerHTML = `Aciertos <b>ajuste</b> (●): ${acc("dev")}<br>Aciertos <b>prueba</b> (○): ${acc("test")}<br>
      <span class="${casiResp ? "bad" : "ok"}">Casi del dominio que RESPONDEN (alucinarían): ${casiResp}/${casi.length}</span>
      <div class="muted" style="font-size:19px;margin-top:6px">Mueve los umbrales: lo que sea «parecido» a tu corpus se cuela. Un umbral no distingue parecido de respondido.</div>`;
  };
  $("#ab-t", el).value = P.tau; $("#ab-b", el).value = P.beta;
  $("#ab-t", el).oninput = render; $("#ab-b", el).oninput = render;
  $("#ab-elegidos", el).onclick = () => { $("#ab-t", el).value = P.tau; $("#ab-b", el).value = P.beta; render(); };
  render();
}

  el.innerHTML = `<div class="grid" style="grid-template-columns:1fr 1fr;gap:34px"><div>
      <div class="muted" style="font-size:22px;margin-bottom:8px">Cambio propuesto (vigente: híbrido α=0.7 → MRR <b>${f2(vigente)}</b> en prueba)</div>
      <div class="col" style="gap:8px">${Object.entries(cands).map(([k, v]) => `<button class="opc" data-k="${k}" style="margin:0;padding:12px 20px;font-size:23px">${v[0]}</button>`).join("")}</div>

    <div id="pu-res" class="card" style="min-height:420px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px"><span class="muted" style="font-size:26px">Elige un cambio y mira si la puerta lo deja pasar.</span></div></div>`;

    <div style="flex:1"><div class="barra" style="height:14px;margin-bottom:3px"><i style="width:${l.p50 / mx * 100}%;background:var(--c-denso)"></i></div><div class="barra" style="height:14px"><i style="width:${l.p95 / mx * 100}%;background:var(--c-rrf)"></i></div></div>
    <span class="mono" style="font-size:18px;width:150px">p50 ${l.p50.toFixed(2)} · p95 ${l.p95.toFixed(2)}</span></div>`).join("");
  $$(".opc", el).forEach(b => b.onclick = () => {

    $("#pu-res", el).innerHTML = `<div style="font-size:26px">${nombre}</div>
      <div style="width:100%;max-width:560px"><div class="fila" style="flex-wrap:nowrap"><span style="width:110px;font-size:22px">vigente</span><div class="barra" style="flex:1;height:30px"><i style="width:${vigente * 100}%;background:var(--c-hib)"></i></div><b>${f2(vigente)}</b></div>
        <div class="fila" style="flex-wrap:nowrap;margin-top:8px"><span style="width:110px;font-size:22px">candidato</span><div class="barra" style="flex:1;height:30px"><i style="width:${mrr * 100}%;background:${pasa ? "var(--ok)" : "var(--bad)"}"></i></div><b>${f2(mrr)}</b></div></div>
      <div class="muted" style="font-size:22px">tolerancia −${TOL} · diferencia ${mrr - vigente >= 0 ? "+" : ""}${f2(mrr - vigente)}</div>
      <div class="sello ${pasa ? "pasa" : "bloq"}">${pasa ? "PASA" : "BLOQUEADO"}</div>`;
  });
}

const ARBOL = {

  q5a: { t: "¿Y también preguntas en lenguaje natural con palabras distintas a las del documento?", si: "r_hibrido", no: "r_bm25" },

  r_arbol: { r: "Vectorless (árbol del documento)", why: "Navega capítulos → secciones y entrega la cláusula íntegra con menos contexto. Idealmente un LLM razona sobre el índice.", nb: "Notebook 02" },

    history.replaceState(null, "", "#" + (i + 1)); relojPintar();
  }
  function sig() { if (cur < 0) return; if (paso < SLIDES[cur].maxPaso) { paso++; aplicarPasos(); } else ir(cur + 1); arrancar(); }
  function ant() { if (paso > 0) { paso--; aplicarPasos(); } else ir(cur - 1, true); }

  /* reloj y ritmo */
  function relojPintar() {
    const ms = acumulado + (pausa === false ? Date.now() - t0 : 0), m = ms / 60000, plan = SLIDES[cur].min, dif = m - plan;
    const mm = String(Math.floor(m)).padStart(2, "0"), ss = String(Math.floor(ms / 1000) % 60).padStart(2, "0");
    let r = "";
    if (pausa !== null) r = Math.abs(dif) < 1 ? " · en ritmo" : dif < 0 ? ` · <span class="adel">${Math.abs(dif).toFixed(0)} min adelantado</span>` : ` · <span class="atras">${dif.toFixed(0)} min atrasado</span>`;
    $("#reloj").innerHTML = `⏱ ${mm}:${ss}/${TOTAL}:00${r}${pausa === true ? " (pausa)" : ""}`;
  }
  function arrancar() { if (pausa === null) { pausa = false; t0 = Date.now(); timer = setInterval(relojPintar, 1000); } }
  function alternarReloj() {
    if (pausa === null) arrancar();
    else if (pausa === false) { acumulado += Date.now() - t0; pausa = true; }
    else { pausa = false; t0 = Date.now(); }
    relojPintar();
  }

  /* vista general, notas, ayuda, tema, pantalla completa */
  $("#vista .cuadricula").innerHTML = SLIDES.map((s, i) => `<div class="mini" data-i="${i}"><small>${s.raw ? "" : s.bloque}</small><b>${s.raw ? s.titulo : s.titulo.replace(/<[^>]+>/g, "")}</b><span>${i + 1} · minuto ${s.min}</span></div>`).join("");
  $$("#vista .mini").forEach(m => m.onclick = () => { ir(+m.dataset.i); $("#vista").classList.remove("ver"); });
  const alt = (id) => $(id).classList.toggle("ver");
  function tema() { const r = document.documentElement; r.dataset.tema = r.dataset.tema === "oscuro" ? "" : "oscuro"; }
  function pantalla() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
  $("#b-ant").onclick = ant; $("#b-sig").onclick = sig; $("#b-vista").onclick = () => alt("#vista"); $("#b-notas").onclick = alternarPanel; $("#b-guion").onclick = alternarModo;
  $("#b-reloj").onclick = alternarReloj; $("#b-tema").onclick = tema; $("#b-full").onclick = pantalla; $("#b-ayuda").onclick = () => alt("#ayuda");

  addEventListener("keydown", e => {
    const t = e.target.tagName; if (["INPUT", "SELECT", "TEXTAREA"].includes(t) && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || (k === " " && t !== "BUTTON")) { e.preventDefault(); sig(); }
    else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); ant(); }
    else if (k === "Home") ir(0); else if (k === "End") ir(N - 1);
    else if (k === "g" || k === "G") alt("#vista"); else if (k === "Escape") { $("#vista").classList.remove("ver"); $("#ayuda").classList.remove("ver"); }
    
    else if (k === "d" || k === "D") tema(); else if (k === "f" || k === "F") pantalla(); else if (k === "?" || k === "h") alt("#ayuda");
  });
  addEventListener("resize", ajustar); ajustar();
  window.DECK = { ir, sig, ant, SLIDES, get cur() { return cur; } };
  const h = parseInt(location.hash.slice(1), 10);
  ir(h >= 1 && h <= N ? h - 1 : 0);
})();
</script>
